<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LearnPath — персонализированное приложение для составления индивидуального учебного плана. Освойте новую профессию или навык по вашему уникальному пути.">
  <title>LearnPath — Персонализированное онлайн-образование</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- AOS - Animate On Scroll -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

  <style>
    /* ===== CSS RESET & VARIABLES ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6C3CE1;
      --primary-dark: #5A2CC0;
      --primary-light: #8B5CF6;
      --accent: #F59E0B;
      --accent-hover: #D97706;
      --bg-dark: #0F0A1A;
      --bg-section: #F8F6FC;
      --bg-white: #FFFFFF;
      --text-dark: #1E1B2E;
      --text-muted: #6B7280;
      --text-light: #9CA3AF;
      --border: #E5E7EB;
      --gradient-primary: linear-gradient(135deg, #6C3CE1 0%, #A855F7 50%, #6C3CE1 100%);
      --gradient-hero: linear-gradient(135deg, #0F0A1A 0%, #1A1130 40%, #2D1B69 100%);
      --gradient-card: linear-gradient(135deg, #FFFFFF 0%, #F8F6FC 100%);
      --shadow-sm: 0 2px 8px rgba(108, 60, 225, 0.08);
      --shadow-md: 0 8px 30px rgba(108, 60, 225, 0.12);
      --shadow-lg: 0 20px 60px rgba(108, 60, 225, 0.18);
      --shadow-hover: 0 12px 40px rgba(108, 60, 225, 0.22);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --max-width: 1200px;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-dark);
      background: var(--bg-white);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: var(--transition);
    }

    ul {
      list-style: none;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 32px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      line-height: 1;
    }

    .btn-primary {
      background: var(--gradient-primary);
      color: #fff;
      box-shadow: 0 4px 20px rgba(108, 60, 225, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(108, 60, 225, 0.45);
    }

    .btn-primary:active {
      transform: translateY(-1px);
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
    }

    .btn-accent:hover {
      background: var(--accent-hover);
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(245, 158, 11, 0.45);
    }

    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-outline:hover {
      background: var(--primary);
      color: #fff;
      transform: translateY(-3px);
    }

    .btn-lg {
      padding: 18px 42px;
      font-size: 1.125rem;
    }

    /* ===== HEADER / NAV ===== */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 16px 0;
      transition: var(--transition);
    }

    .header.scrolled {
      background: rgba(15, 10, 26, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 10px 0;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    .header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      z-index: 1001;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--gradient-primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      font-size: 0.95rem;
      position: relative;
      padding: 4px 0;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: var(--transition);
      border-radius: 2px;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-cta {
      padding: 10px 24px !important;
      font-size: 0.9rem !important;
    }

    /* Mobile menu toggle */
    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      z-index: 1001;
      background: none;
      border: none;
      padding: 8px;
    }

    .menu-toggle span {
      width: 26px;
      height: 2.5px;
      background: #fff;
      border-radius: 2px;
      transition: var(--transition);
    }

    .menu-toggle.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .menu-toggle.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.active span:nth-child(3) {
      transform: rotate(-45deg) translate(6px, -6px);
    }

    /* ===== HERO ===== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--gradient-hero);
      overflow: hidden;
      padding: 120px 24px 80px;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('') center/cover no-repeat;
      opacity: 0.15;
    }

    .hero-bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      pointer-events: none;
    }

    .hero-bg-orb--1 {
      width: 600px;
      height: 600px;
      background: var(--primary);
      top: -200px;
      right: -100px;
    }

    .hero-bg-orb--2 {
      width: 400px;
      height: 400px;
      background: var(--accent);
      bottom: -100px;
      left: -100px;
    }

    .hero-bg-orb--3 {
      width: 300px;
      height: 300px;
      background: #A855F7;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 850px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(108, 60, 225, 0.2);
      border: 1px solid rgba(108, 60, 225, 0.3);
      color: var(--primary-light);
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }

    .hero-badge i {
      font-size: 0.75rem;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .hero h1 .highlight {
      background: linear-gradient(135deg, var(--accent), #FBBF24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-description {
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      color: rgba(255, 255, 255, 0.7);
      max-width: 650px;
      margin: 0 auto 40px;
      line-height: 1.7;
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .hero-stats {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      margin-top: 64px;
      flex-wrap: wrap;
    }

    .hero-stat {
      text-align: center;
    }

    .hero-stat-number {
      font-size: 2.5rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }

    .hero-stat-label {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 6px;
    }

    .hero-scroll-indicator {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      animation: bounce 2s infinite;
      color: rgba(255, 255, 255, 0.4);
      font-size: 1.5rem;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
      40% { transform: translateX(-50%) translateY(-10px); }
      60% { transform: translateX(-50%) translateY(-5px); }
    }

    /* ===== SECTIONS COMMON ===== */
    .section {
      padding: 100px 0;
    }

    .section-header {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 64px;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .section-label::before,
    .section-label::after {
      content: '';
      width: 24px;
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
      opacity: 0.4;
    }

    .section-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 18px;
      letter-spacing: -0.02em;
    }

    .section-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    /* ===== ABOUT APP ===== */
    .about {
      background: var(--bg-section);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
    }

    .about-image {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    .about-image-placeholder {
      width: 100%;
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, #E8DEF8 0%, #D0BCFF 50%, #C3A8F5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .about-image-placeholder svg {
      width: 120px;
      height: 120px;
      opacity: 0.5;
    }

    .about-image-badge {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-md);
    }

    .about-image-badge-icon {
      width: 44px;
      height: 44px;
      background: var(--gradient-primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
    }

    .about-image-badge-text {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    .about-image-badge-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .about-content h2 {
      font-size: clamp(1.75rem, 3vw, 2.5rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .about-content p {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.8;
      margin-bottom: 16px;
    }

    .about-features-list {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .about-feature-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .about-feature-icon {
      width: 28px;
      height: 28px;
      background: rgba(108, 60, 225, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 0.75rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .about-feature-item span {
      font-size: 1rem;
      color: var(--text-dark);
      line-height: 1.5;
    }

    /* ===== JOURNEY (A → B) ===== */
    .journey {
      background: var(--bg-white);
    }

    .journey-path {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 32px;
      align-items: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .journey-point {
      padding: 40px;
      border-radius: var(--radius-lg);
      text-align: center;
    }

    .journey-point--a {
      background: linear-gradient(135deg, #FEF3C7, #FDE68A);
    }

    .journey-point--b {
      background: linear-gradient(135deg, #D1FAE5, #A7F3D0);
    }

    .journey-point-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 20px;
    }

    .journey-point--a .journey-point-icon {
      background: #F59E0B;
      color: #fff;
    }

    .journey-point--b .journey-point-icon {
      background: #10B981;
      color: #fff;
    }

    .journey-point h3 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .journey-point p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .journey-arrow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--primary);
    }

    .journey-arrow i {
      font-size: 2rem;
      animation: arrowPulse 2s ease-in-out infinite;
    }

    .journey-arrow span {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    @keyframes arrowPulse {
      0%, 100% { transform: translateX(0); opacity: 1; }
      50% { transform: translateX(8px); opacity: 0.7; }
    }

    .journey-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      margin-top: 64px;
    }

    .journey-card {
      background: var(--bg-section);
      border-radius: var(--radius-md);
      padding: 32px 28px;
      text-align: center;
      transition: var(--transition);
    }

    .journey-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
    }

    .journey-card-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 1.4rem;
      color: #fff;
    }

    .journey-card h4 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .journey-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* ===== FEATURES ===== */
    .features {
      background: var(--bg-section);
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
    }

    .feature-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: 36px 30px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      border: 1px solid transparent;
    }

    .feature-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-primary);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .feature-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(108, 60, 225, 0.1);
    }

    .feature-card:hover::before {
      transform: scaleX(1);
    }

    .feature-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 22px;
      color: #fff;
    }

    .feature-card h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .feature-card p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    /* ===== ADVANTAGES ===== */
    .advantages {
      background: var(--bg-dark);
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .advantages::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: var(--primary);
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      top: -200px;
      right: -100px;
    }

    .advantages .section-label {
      color: var(--accent);
    }

    .advantages .section-label::before,
    .advantages .section-label::after {
      background: var(--accent);
    }

    .advantages .section-subtitle {
      color: rgba(255, 255, 255, 0.6);
    }

    .advantages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 32px;
      position: relative;
      z-index: 2;
    }

    .advantage-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      padding: 36px 30px;
      transition: var(--transition);
      backdrop-filter: blur(10px);
    }

    .advantage-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(108, 60, 225, 0.4);
      transform: translateY(-6px);
    }

    .advantage-card-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(108, 60, 225, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--primary-light);
      margin-bottom: 20px;
    }

    .advantage-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .advantage-card p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.7;
    }

    .advantage-comparison {
      margin-top: 64px;
      position: relative;
      z-index: 2;
    }

    .comparison-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: rgba(255, 255, 255, 0.03);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .comparison-table th,
    .comparison-table td {
      padding: 18px 24px;
      text-align: left;
      font-size: 0.95rem;
    }

    .comparison-table thead th {
      background: rgba(108, 60, 225, 0.2);
      font-weight: 700;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .comparison-table tbody td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.7);
    }

    .comparison-table tbody tr:last-child td {
      border-bottom: none;
    }

    .comparison-table tbody tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .check {
      color: #34D399;
      font-weight: 700;
    }

    .cross {
      color: #EF4444;
      font-weight: 700;
    }

    .comparison-highlight {
      background: rgba(108, 60, 225, 0.08);
    }

    /* ===== TESTIMONIALS ===== */
    .testimonials {
      background: var(--bg-white);
    }

    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
    }

    .testimonial-card {
      background: var(--bg-section);
      border-radius: var(--radius-lg);
      padding: 36px 30px;
      transition: var(--transition);
      position: relative;
    }

    .testimonial-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
    }

    .testimonial-stars {
      color: var(--accent);
      font-size: 0.9rem;
      margin-bottom: 18px;
      display: flex;
      gap: 3px;
    }

    .testimonial-text {
      font-size: 1rem;
      color: var(--text-dark);
      line-height: 1.8;
      margin-bottom: 24px;
      font-style: italic;
    }

    .testimonial-author {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .testimonial-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .testimonial-author-info h4 {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .testimonial-author-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ===== FAQ ===== */
    .faq {
      background: var(--bg-section);
    }

    .faq-list {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .faq-item {
      background: var(--bg-white);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .faq-item.active {
      border-color: rgba(108, 60, 225, 0.3);
      box-shadow: var(--shadow-sm);
    }

    .faq-question {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 28px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-dark);
      text-align: left;
      transition: var(--transition);
    }

    .faq-question:hover {
      color: var(--primary);
    }

    .faq-question-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-section);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--primary);
      flex-shrink: 0;
      transition: var(--transition);
    }

    .faq-item.active .faq-question-icon {
      background: var(--primary);
      color: #fff;
      transform: rotate(180deg);
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.4s ease;
    }

    .faq-answer-inner {
      padding: 0 28px 22px;
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.8;
    }

    /* ===== PRICING ===== */
    .pricing {
      background: var(--bg-white);
    }

    .pricing-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 32px;
      max-width: 900px;
      margin: 0 auto;
    }

    .pricing-card {
      background: var(--bg-white);
      border: 2px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 44px 36px;
      text-align: center;
      transition: var(--transition);
      position: relative;
    }

    .pricing-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
    }

    .pricing-card.featured {
      border-color: var(--primary);
      background: var(--gradient-hero);
      color: #fff;
      transform: scale(1.05);
    }

    .pricing-card.featured:hover {
      transform: scale(1.05) translateY(-8px);
    }

    .pricing-badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      padding: 6px 24px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .pricing-card h3 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .pricing-card .pricing-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .pricing-card.featured .pricing-desc {
      color: rgba(255, 255, 255, 0.6);
    }

    .pricing-amount {
      margin-bottom: 32px;
    }

    .pricing-amount .price {
      font-size: 3.5rem;
      font-weight: 900;
      line-height: 1;
    }

    .pricing-amount .currency {
      font-size: 1.5rem;
      font-weight: 700;
      vertical-align: super;
    }

    .pricing-amount .period {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .pricing-card.featured .pricing-amount .period {
      color: rgba(255, 255, 255, 0.5);
    }

    .pricing-features {
      text-align: left;
      margin-bottom: 36px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .pricing-features li {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
    }

    .pricing-features li i {
      color: #34D399;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .pricing-card.featured .pricing-features li {
      color: rgba(255, 255, 255, 0.8);
    }

    .pricing-card .btn {
      width: 100%;
    }

    /* ===== FOOTER ===== */
    .footer {
      background: var(--bg-dark);
      color: rgba(255, 255, 255, 0.7);
      padding: 64px 0 32px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 48px;
      margin-bottom: 48px;
    }

    .footer-brand p {
      font-size: 0.95rem;
      line-height: 1.7;
      margin-top: 16px;
      max-width: 300px
